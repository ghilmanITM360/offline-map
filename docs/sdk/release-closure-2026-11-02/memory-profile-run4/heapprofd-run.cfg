buffers { size_kb: 49152 fill_policy: DISCARD }
data_sources {
  config {
    name: "android.heapprofd"
    heapprofd_config {
      sampling_interval_bytes: 8192
      process_cmdline: "com.example.sdkconsumer"
      shmem_size_bytes: 4194304
      block_client: true
      all_heaps: true
      continuous_dump_config { dump_phase_ms: 20000 dump_interval_ms: 45000 }
    }
  }
}
duration_ms: 3600000
